[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# npe2 requires this distribution name to equal the manifest `name:` field,
# which is also the `napari --plugin <name>` plugin name. Keep all three as
# "openuc2-processor".
name = "openuc2-processor"
version = "0.1.0"
description = "Download and process openUC2 / ImSwitch microscopy datasets in napari"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "openUC2" }]
keywords = ["napari", "openUC2", "ImSwitch", "microscopy", "stitching"]
classifiers = [
    "Framework :: napari",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "napari>=0.4.18",
    "qtpy",
    "numpy",
    "tifffile",
    "requests",
    "ashlarUC2",
]

[project.urls]
Homepage = "https://github.com/openUC2/napari-openuc2-processor"
"Bug Tracker" = "https://github.com/openUC2/napari-openuc2-processor/issues"
"Source Code" = "https://github.com/openUC2/napari-openuc2-processor"
"User Support" = "https://github.com/openUC2/napari-openuc2-processor/issues"

[project.optional-dependencies]
# NOTE: OME-Zarr layer viewing is intentionally NOT a dependency here.
# napari-ome-zarr -> ome-zarr -> fsspec[s3] -> s3fs, and on Python 3.13/3.14 the
# resolver can land on the ancient s3fs 0.3.5 which fails to build
# (configparser.SafeConfigParser was removed). If you want to view .zarr in
# napari, install it separately in an env where it resolves, e.g.:
#     pip install "napari-ome-zarr" "s3fs>=2024"
testing = ["pytest", "npe2"]

[project.entry-points."napari.manifest"]
# entry-point name == distribution name == manifest name == `--plugin` name.
openuc2-processor = "openuc2_processor:napari.yaml"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openuc2_processor = ["napari.yaml"]
